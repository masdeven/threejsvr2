<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>WebXR Computer Lab</title>
    <link rel="stylesheet" href="css/style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.162.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.162.0/examples/jsm/",
          "stats.js": "https://unpkg.com/three@0.162.0/examples/jsm/libs/stats.module.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="orientation-overlay" class="hidden">
      <div class="message">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="currentColor"
          width="80px"
          height="80px"
        >
          <path
            d="M18.5,6.5H15.5a1,1,0,0,1,0-2h4a1,1,0,0,1,1,1v4a1,1,0,0,1-2,0V6.92A9,9,0,0,1,6.58,20.42,1,1,0,0,1,8,19.58,7,7,0,0,0,18.5,6.5Z"
          />
          <path
            d="M5.5,17.5H8.5a1,1,0,0,1,0,2h-4a1,1,0,0,1-1-1v-4a1,1,0,0,1,2,0v2.58A9,9,0,0,1,17.42,3.58a1,1,0,1,1-1.42,1.42A7,7,0,0,0,5.5,17.5Z"
          />
        </svg>
        <p>Please rotate your device to landscape mode.</p>
      </div>
    </div>
    <!-- Scene Three.js -->
    <div id="container"></div>

    <!-- Splash Screen -->
    <div id="splash-screen" class="screen-overlay">
      <div class="spinner"></div>
      <div class="progress-bar-container">
        <div id="progress-bar"></div>
      </div>
      <p id="loading-text">Initializing...</p>
    </div>

    <!-- Overlay Selamat Datang -->
    <div id="welcome-overlay" class="screen-overlay hidden">
      <h1>WebXR Computer Lab.</h1>
      <p>
        A cross-platform virtual reality experience built with Three.js and
        WebXR — bringing computer hardware education to life.
      </p>
      <button id="welcome-next-button" class="overlay-button">
        Start the Experience
      </button>
    </div>

    <!-- Overlay Input Nama -->
    <div id="name-input-overlay" class="screen-overlay hidden">
      <div class="input-container">
        <input
          type="text"
          id="player-name-input"
          maxlength="8"
          autocomplete="off"
          required
        />
        <label for="player-name-input" class="label">Enter your name*</label>
      </div>
      <button id="continue-button" class="overlay-button">OK</button>
    </div>

    <a
      href="https://github.com/Falachul/webxr-v2"
      target="_blank"
      id="github-button"
      class="floating-button"
    >
      &lt;/&gt;
      <span class="tooltip">Lihat Kode Sumber di GitHub</span>
    </a>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
