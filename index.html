<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>WebXR Computer Lab</title>
    <link rel="stylesheet" href="css/style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.162.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.162.0/examples/jsm/",
          "stats.js": "https://unpkg.com/three@0.162.0/examples/jsm/libs/stats.module.js"
        }
      }
    </script>
  </head>
  <body>
    <!-- Scene Three.js -->
    <div id="container"></div>

    <!-- Splash Screen -->
    <div id="splash-screen" class="screen-overlay">
      <div class="spinner"></div>
      <div class="progress-bar-container">
        <div id="progress-bar"></div>
      </div>
      <p id="loading-text">Memuat Aset...</p>
    </div>

    <!-- Overlay Selamat Datang -->
    <div id="welcome-overlay" class="screen-overlay hidden">
      <h1>WebXR Computer Lab.</h1>
      <p>
        Visualisasi Interaktif Perangkat Keras Komputer melalui web 3D dan VR.
      </p>
      <button id="welcome-next-button" class="overlay-button">
        Yuk Mulai Sekarang
      </button>
    </div>

    <!-- Overlay Input Nama -->
    <div id="name-input-overlay" class="screen-overlay hidden">
      <div class="input-container">
        <input
          type="text"
          id="player-name-input"
          maxlength="15"
          autocomplete="off"
          required
        />
        <label for="player-name-input" class="label">Siapa namu kamu?*</label>
      </div>
      <button id="continue-button" class="overlay-button">OK</button>
    </div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
